name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    # LLM 호출 없는 단위 테스트 + 린트. 모든 PR 과 main push 에서 실행.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run --with ruff ruff check .
      - run: uv run pytest -q
